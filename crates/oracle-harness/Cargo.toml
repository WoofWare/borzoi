[package]
name = "borzoi-oracle-harness"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
borzoi-spawn.workspace = true
# `thread_cpu` reads the calling thread's CPU clock (`clock_gettime`).
libc = "0.2"
# rustc's own lexer, used by `module_tree` to read `mod` declarations without
# re-implementing Rust's string/comment/raw-literal lexing by hand.
proc-macro2.workspace = true
# The `nuget-oracle` and `uses-project-graph-batch` protocols are JSON lines
# (`nuget_oracle`, `project_graph`).
serde.workspace = true
serde_json.workspace = true
# The directory a `project_graph` fixture is written to.
tempfile.workspace = true
# `xml_pump` locates the element paths it repeats.
roxmltree.workspace = true

[dev-dependencies]
proptest.workspace = true
