[package]
name = "borzoi-sema"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
borzoi-cst = { workspace = true, features = ["unstable-union"] }
borzoi-assembly.workspace = true
# Structured spans for the resolution fold, so the per-file cost of
# `resolve_project` shows up in the LSP's OpenTelemetry traces. Optional and
# gated behind the `otel` feature so the default, reusable core has no `tracing`
# dependency at all; the LSP's own `otel` feature turns it on.
tracing = { workspace = true, optional = true }
# Union-find / unification table (the crate `rustc` itself uses) — the
# inference substrate for Phase 3 type inference (see `docs/type-checker-plan.md`
# D8). Default features only (no `dogged`/`persistent`); its lone transitive dep
# is `log`, already in the workspace lockfile.
ena.workspace = true
# The hasher behind every map and set sema builds (`src/hash.rs`). No
# dependencies of its own.
foldhash.workspace = true

[features]
# Emit per-file `resolve_file` spans from the resolution fold. Off by default so
# the reusable core stays free of `tracing`; enabled transitively by the LSP's
# `otel` feature (the only build that installs a subscriber to record them).
otel = ["dep:tracing"]
# Open a span around each `resolve_file` and around each of its phases
# (`fold_counts`), so `borzoi`'s `edit_counts` example can count the work each
# phase does. Off by default, as `otel` is: the spans cost a callsite check
# each even with no subscriber.
fold-counts = ["dep:tracing"]
# The FCS-differential comparator (the `test_support` module): given one of our
# resolutions and the oracle's structural name for the same use, decide whether
# they name the same declaration. Two harnesses need it — `borzoi-corpus-diff`
# and the LSP crate's `resolve_real_project_diff` — and neither can import the
# other, so it lives below both. Off by default: nothing at runtime compares
# against an oracle.
test-support = []
# Every `resolve_file` also runs the surface walk (`surface_file`) on the same
# file and entering state, and panics unless the two publish the same
# `FileSurface` (`docs/resolve-what-a-request-reads-plan.md`, D3). On in this
# crate's tests and the whole-project gate's, never in a build that serves
# requests: it doubles the declaration walk.
surface-reference = []

[dev-dependencies]
borzoi-oracle-harness.workspace = true
# The metric-path walk the stats dashboard plots by, so a generator's
# pinned metric namespace is read exactly as it is published.
borzoi-stats.workspace = true
# Self-reference activates `test-support` when building this crate for its own
# integration tests, so they exercise the shared comparator without a
# `--features` flag on the test command; `fold-counts`, so the test of the
# fold's phase spans runs; and `surface-reference`, so every file a test
# resolves checks its surface walk.
borzoi-sema = { path = ".", features = ["test-support", "fold-counts", "surface-reference"] }
proptest.workspace = true
# Reads `Gen::infer_construct`'s arms for the expected-type alphabet
# (`tests/all/infer_entry_order_diff.rs`).
syn.workspace = true
serde.workspace = true
serde_json.workspace = true
# The overload-coverage measurement identifies its corpus by digesting the
# matrix it generates: that corpus is repo source rather than a pinned external
# tree, so nothing else can say when two observations measured the same thing.
sha1.workspace = true
